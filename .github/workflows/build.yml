name: Build

on:
  workflow_call:

  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup node environment (for building)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch dependencies
        run: |
          npm install

      - name: Build project
        run: |
          npm run build
